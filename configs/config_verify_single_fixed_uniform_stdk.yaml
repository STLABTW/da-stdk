# Single-experiment verification config: Fixed_Uniform_STDK (matches KAUST experiment run table_4_4_20260203_153043)
# Base: config_default + config_kaust_data + Fixed_Uniform_STDK (site-wise, uniform, STDK)

tag: kaust_Fixed_Uniform_STDK
data_file: data/2b/2b_8.csv
n_experiments: 1
base_seed: 2025

# Fixed_Uniform: site-wise, uniform
obs_method: site-wise
obs_spatial_pattern: uniform
# STDK: fixed bases
spatial_learnable: false
spatial_init_method: uniform
use_delta_reparameterization: false
non_crossing_lambda: 0.0

# KAUST experiment
split_method: random
train_ratio: 0.8
calibration_ratio_from_train: 0.2
calibration_split_method: random
lr: 0.01
basis_lr_ratio: 0.05
conformal_mode: both
crps_weighting: trapezoidal

# Rest from base (config_default)
k_spatial_centers: [25, 81, 121]
k_temporal_centers: [10, 15, 45]
spatial_basis_function: wendland
gradient_damping: true
damping_threshold: 0.0
damping_strength: 5.0
domain_penalty_weight: 0.01
movement_penalty_weight: 0.0
sparsity_penalty_type: none
sparsity_lambda_l1: 0.0
sparsity_lambda_group: 0.0
sparsity_apply_to_spatial: true
sparsity_apply_to_temporal: false
sparsity_threshold_ratio: 0.01
non_crossing_l1_penalization: true
hidden_dims: [256, 256, 128]
dropout: 0.1
layernorm: true
p_covariates: 0
use_provider_split: false
obs_ratio: 0.1
obs_spatial_intensity: 10.0
conformal_center_source: trained
conformal_cluster_min_n: 30
conformal_alpha: 0.1
save_predictions_quantile: true
normalize_target: false
epochs: 500
weight_decay: 5e-4
batch_size: 4096
patience: 50
grad_clip: 10.0
scheduler: cosine
warmup_epochs: 10
basis_unfreeze_epoch: 10
basis_lr_rampup_epochs: 10
num_workers: 0
regression_type: multi-quantile
quantile_levels: [0.05, 0.25, 0.5, 0.75, 0.95]
device: cpu
